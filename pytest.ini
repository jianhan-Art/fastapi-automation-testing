[pytest]
# Pytest 配置文件
minversion = 7.0

# 测试文件模式
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 输出配置
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings

# 自定义标记
markers =
    api: API 接口测试
    web: Web 自动化测试
    slow: 标记为慢速测试
    integration: 集成测试

# 测试路径
testpaths = tests

# 最小 Python 版本
minversion = 3.8
